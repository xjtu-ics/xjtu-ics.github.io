# Project information
site_name: Introduction to Computer Systems Spring 2026
site_url: https://xjtu-ics.github.io/
site_author: XJTU-ICS TEAM
site_description: >-
  XJTU-ICS Webpage
# Repository
repo_name: xjtu-ics/xjtu-ics.github.io
repo_url: https://github.com/xjtu-ics/xjtu-ics.github.io
# Copyright
copyright: Copyright &copy; 2026 XJTU ICS-TEAM
# Configuration
theme:
  name: material
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.tabs
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs
  palette:
    primary: black
  logo: assets/logo.png
  favicon: assets/favicon.png
  custom_dir: overrides
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
# Plugins
plugins:
  - search
  - tags
  - open-in-new-tab
  - macros:
      module_name: scripts/macros
  - mike

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.blocks.caption
  - pymdownx.details
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - admonition
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true

extra:
  version:
    provider: mike
    alias: true
extra_css:
  - stylesheets/custom.css
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
# Page tree
nav:
  - Overview: index.md
  - Labs:
    - "Lab 0: Tutorial and Environmental Preparation": labs/lab0.md
    - "Lab 1: Data Lab": labs/lab1.md
    - "Lab 2: Bomb Lab": labs/lab2.md
    - "Lab 3: Attack Lab": labs/lab3.md
    - "Lab 4: Cache Lab":
      - "Before You Begin": labs/lab4.md
      - "Lab 4A: Cache-Sim": labs/lab4A.md
      - "Lab 4B: Cache-Opt": labs/lab4B.md
    - "Lab 5: Optimization Lab": labs/lab5.md
    # - "Lab 6: Linker Lab": labs/lab6.md
    # - "Lab 7: Malloc Lab": labs/lab7.md
  - Staff: staff/index.md
  - Policies: policies/index.md
  - Resources:
    - Quick Reference: resources/quickreference.md
    - ICS-Server: resources/ICS-Server.md
    - VSCode Remote-SSH Setting: resources/VScodeRemote-SSH.md
    - Linux Installation: resources/LinuxInstallation.md
    - Introduction to GDB & Debugging: resources/Introduction_to_GDB_and_Debugging.md
  - Textbook: https://xjtu-ics.github.io/textbook/
  - Piazza: https://piazza.com/stu.xjtu.edu.cn/spring2026/xjtuics
  - FAQ:
    - "Lab 0: Tutorial and Environmental Preparation": FAQ/lab0.md
